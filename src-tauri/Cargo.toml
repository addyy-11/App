[package]
name = "eduhealth-desktop"
version = "1.0.0"
description = "EduHealth Desktop — Premium All-in-One Student Productivity & Wellness Application"
authors = ["EduHealth Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["notification-all", "dialog-all", "fs-all", "path-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
